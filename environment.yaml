
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10.12
  - pip=26.2.1
  - pip:
    - matplotlib==3.7.2
    - scipy==1.11.1
    - numpy==1.26.4
    - ipympl==0.9.4
    - jupyterlab==4.0.3
    - ipywidgets==8.0.7
    - notebook==7.0.0
    - pytest==8.4.1
    - tqdm==4.66.4
    - yacs==0.1.8
    # Adds the PyTorch CUDA wheel index as an extra source (does not replace PyPI).
    # Remove the next two lines and add `- torch==2.0.0` for a CPU-only install.
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.0.0+cu118