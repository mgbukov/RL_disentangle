# This config is compatible only with `train.py`
model_device: "cuda"
seed: 0

num_qubits: 4
num_iters: 4000
num_envs: 64
steps: 8
steps_limit: 16
epsi: 1e-3
obs_fn: rdm_2q_rsqr_nisq_mean_real
fast_obs: False
fast_ents: False
reward_fn: relative_delta
stategen_fn: sample_haar_unif
stategen_params: [
  [min_entangled, 2],
  [max_entangled, 4],
]

pi_lr: 2e-4
vf_lr: 3e-4
discount: 0.95
batch_size: 128
clip_grad: 1.0
entropy_reg: 0.1

# Policy network parameters
transformer_layers: 2
attn_heads: 2
embed_dim: 128
dim_mlp: 256

log_every: 100
checkpoint_every: 1000
test_every: 1000000
test_states: []
num_tests: 100
trigger_every: 1000
triggers: []
triggers_levels: []
logdir_prefix: ""
logdir_suffix: "_final_"
