[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "qsimh"
version = "0.1"
dependencies = [
    "matplotlib >= 3.7.3",
    "scipy >= 1.10.1",
    "numpy >= 1.25.2",
    "torch >= 2.0.0",
    "ipympl >= 0.9.4",
    "jupyterlab >= 4.2.1",
    "ipywidgets >= 8.1.3",
    "notebook >= 7.2.0",
    "tqdm >= 4.66.4",
    "cvxpy >= 1.3.1",
    "qiskit == 0.44.2",
    "qiskit-experiments == 0.5.2",
    "pylatexenc >= 2.10"
]

[tool.setuptools.package-dir]
qsimh = "qsimh/"

[tool.setuptools]
include-package-data = true


[tool.setuptools.package-data]
qsimh = ["qsimh/agents/*"]
